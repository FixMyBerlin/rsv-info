name: Trassenscout sync

on:
  schedule:
    - cron: '0 6 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          Branch to sync into. Use main for the weekly-style PR. Use a Keystatic
          branch (e.g. sn-variant) to add geometry to that PR.
        required: true
        default: main
        type: string
  push:
    branches-ignore:
      - main
      - sync/trassenscout
    paths:
      - src/data/steckbriefe/**

# `issues: write` lets the token check open a renewal reminder issue.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: >-
    trassenscout-sync-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event_name == 'schedule' && 'main' || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.branch != 'main') }}

jobs:
  sync-trassenscout:
    name: Sync Trassenscout data and map images
    if: "${{ github.actor != 'dependabot[bot]' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: synchronise with Trassenscout')) }}"
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      # TRASSENSCOUT_SYNC_TOKEN is a GitHub token (not a Trassenscout one; that API is public).
      # It is only needed so the sync commit / sync PR triggers CI. When it is missing, expired
      # or revoked, the sync falls back to the built-in GITHUB_TOKEN and still runs, just without
      # CI on the sync commit. Renewal steps: docs/EDITORIAL.md → "Trassenscout sync token".
      - name: Check sync token
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.TRASSENSCOUT_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # Update together with the token. Shown on GitHub when the token is created.
          SYNC_TOKEN_EXPIRES_ON: '2027-10-15'
          REMIND_DAYS_BEFORE: '30'
          ISSUE_TITLE: 'Trassenscout sync: renew TRASSENSCOUT_SYNC_TOKEN'
          ISSUE_ASSIGNEE: tordans
        run: |
          # usable: the secret is set and GitHub accepts it. problem: text for warning and issue.
          usable=false
          problem=''
          if [ -z "$SYNC_TOKEN" ]; then
            problem='The repository secret TRASSENSCOUT_SYNC_TOKEN is not set.'
          else
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}")
            if [ "$status" = '200' ]; then
              usable=true
            else
              problem="GitHub rejected TRASSENSCOUT_SYNC_TOKEN (HTTP $status); it is probably expired or revoked."
            fi
          fi
          echo "use_sync_token=$usable" >> "$GITHUB_OUTPUT"

          days_left=$(( ( $(date -ud "$SYNC_TOKEN_EXPIRES_ON" +%s) - $(date -u +%s) ) / 86400 ))
          if [ "$usable" = true ] && [ "$days_left" -le "$REMIND_DAYS_BEFORE" ]; then
            problem="TRASSENSCOUT_SYNC_TOKEN expires on $SYNC_TOKEN_EXPIRES_ON ($days_left days left)."
          fi
          if [ "$usable" = false ]; then
            problem="$problem The sync falls back to GITHUB_TOKEN: it still runs, but CI does not run on the sync commit or sync PR."
          fi

          if [ -z "$problem" ]; then
            echo "Sync token OK, expires on $SYNC_TOKEN_EXPIRES_ON ($days_left days left)."
            exit 0
          fi

          echo "::warning::$problem"
          {
            echo "### Trassenscout sync token"
            echo
            echo "$problem"
            echo
            echo "Renewal steps: [docs/EDITORIAL.md](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/EDITORIAL.md#trassenscout-sync-token)"
          } >> "$GITHUB_STEP_SUMMARY"

          # One open reminder issue at a time; the weekly run adds a comment, Steckbrief saves do not.
          body="$problem

          Renew the token following [docs/EDITORIAL.md → Trassenscout sync token](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/EDITORIAL.md#trassenscout-sync-token), then update \`SYNC_TOKEN_EXPIRES_ON\` in \`.github/workflows/weekly-trassenscout-sync.yaml\` and close this issue.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "${{ github.event_name }}" = schedule ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body" || true
          elif [ -z "$existing" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$ISSUE_TITLE" \
              --assignee "$ISSUE_ASSIGNEE" --body "$body" || true
          fi

      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.branch }}
          token: ${{ steps.token.outputs.use_sync_token == 'true' && secrets.TRASSENSCOUT_SYNC_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Trassenscout cache and static map images
        run: bun run trassenscout:sync

      # Fixed branch name: create-pull-request updates the open PR instead of opening a second one.
      - name: Create or update pull request
        if: ${{ steps.target.outputs.branch == 'main' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.use_sync_token == 'true' && secrets.TRASSENSCOUT_SYNC_TOKEN || github.token }}
          branch: sync/trassenscout
          base: main
          title: Syncronisation mit Trassenscout
          assignees: mlvln
          commit-message: 'chore: synchronise with Trassenscout'
          body: |
            Automated weekly sync from Trassenscout.

            - Checked-in geometry and API fields (including RSV-D filtered caches): `src/data/trassenscout/`
            - Social sharing map images: `public/rsv-map-images/`

            Review the Netlify deploy preview, then merge to `main` for production (IONOS).
          add-paths: |
            src/data/trassenscout
            public/rsv-map-images
          labels: |
            automated
            trassenscout

      - name: Commit sync onto branch
        if: ${{ steps.target.outputs.branch != 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/trassenscout public/rsv-map-images
          if git diff --staged --quiet; then
            echo "No Trassenscout cache or map image changes"
            exit 0
          fi
          git commit -m "chore: synchronise with Trassenscout"
          if ! git pull --rebase origin "${{ steps.target.outputs.branch }}"; then
            echo "Rebase failed; a newer save will re-run the sync"
            exit 0
          fi
          if ! git push origin "HEAD:${{ steps.target.outputs.branch }}"; then
            echo "Push rejected (non-fast-forward); a newer save will re-run the sync"
            exit 0
          fi
