# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: dist

jobs:
# Please do not rename this job
  build-project:
    name: build rsv-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # Production uses `bun run build` (checked-in src/data/trassenscout/*.json only).
      # Netlify CMS uses `bun run build:netlify` (syncs Trassenscout first) — see netlify.toml.
      # Bun-only: withastro/action always installs Node (setup-node@v4 = Node 20 action runtime).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile
      - name: Build site
        env:
          KEYSTATIC_STORAGE_KIND: "local"
          ASTRO_ENV: "production"
          ASTRO_OUTPUT_MODE: "static"
          ASTRO_USE_NETLIFY_ADAPTER: "false"
          HUSKY: '0'
        run: bun run build

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 38f7a9d4-2b61-4f59-aafa-07d314395125
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/rsv-info/config.yaml
          action: upload
