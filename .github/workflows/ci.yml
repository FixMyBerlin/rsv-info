# Copy from tech-stack CI template; IONOS Deploy Now stays in rsv-info-*.yaml.
name: CI

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, Unlicense, CC0-1.0, AGPL-3.0, AGPL-3.0-or-later
          # GitHub's dependency graph has no SPDX for Actions (license Null).
          allow-dependencies-licenses: pkg:githubactions/actions/checkout, pkg:githubactions/oven-sh/setup-bun, pkg:githubactions/peter-evans/create-pull-request
          # GHSA-26w7-cxv4-gfx2 is Sharp/libheif AVIF RCE. Astro only lists a patch on 7.2.8;
          # this site stays on Astro 6 and pins sharp >= 0.35.4 (the actual libheif fix).
          allow-ghsas: GHSA-26w7-cxv4-gfx2

  check:
    name: Run Type Check & Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile

      - name: Verify (read-only)
        env:
          HUSKY: '0'
        run: bun run check-ci
