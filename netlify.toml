[build]
# Deploy Previews match IONOS (checked-in Trassenscout JSON). CMS production still live-syncs.
command = "if [ \"$CONTEXT\" = \"deploy-preview\" ]; then KEYSTATIC_STORAGE_KIND=local ASTRO_ENV=production ASTRO_OUTPUT_MODE=static ASTRO_USE_NETLIFY_ADAPTER=false bun run build; else bun run build:netlify; fi"
publish = "dist"
# Exit 0 = skip. Skip Dependabot Deploy Previews only (not production or other branch deploys).
# Do not put [skip netlify] in Dependabot commit messages — rebase-merge would
# skip Netlify on main after merge.
ignore = "if [ \"$CONTEXT\" = \"deploy-preview\" ] && echo \"$HEAD$BRANCH\" | grep -qiE 'dependabot'; then exit 0; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\""

[build.environment]
BUN_VERSION = "1.4.0"
BUN_FLAGS = "--frozen-lockfile --config=bunfig.netlify.toml"
